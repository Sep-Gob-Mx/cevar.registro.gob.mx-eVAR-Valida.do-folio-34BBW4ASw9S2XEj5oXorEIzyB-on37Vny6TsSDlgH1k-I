<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f2f2f2;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* SOLO CELULARES */
        @media (max-width: 745px) {
            body {
                overflow-x: hidden;
            }

            img {
                width: 100%;
                height: 150vh;
                object-fit: cover;
                object-position: center top;
                max-width: none;
                /* Aumentar 15% desde el centro */
                transform: scale(.85);
                transform-origin: center top;
            }
        }
    </style>
</head>

<body>
    <img src="pagina.png" alt="Consulta">
</body>
</html>
