Perfecto. Vamos a hacer que en el celular la imagen se vea más larga hacia abajo, quitando el margin-left: -50%, pero manteniendo la versión de computadora exactamente igual.

Usa este código completo:


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f2f2f2;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* SOLO CELULARES */
        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
            }

            img {
                width: 100%;
                height: 150vh;
                object-fit: cover;
                object-position: center top;
                max-width: none;
            }
        }
    </style>
</head>

<body>
    <img src="pagina.png" alt="Consulta">
</body>
</html>
